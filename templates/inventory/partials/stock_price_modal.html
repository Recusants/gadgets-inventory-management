{% load static %}
<div class="p-6">
  
  <!-- Header -->
  <div class="flex items-center justify-between pb-4 border-b border-gray-200">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center text-lg shadow-sm">
        <i class="fas fa-tag"></i>
      </div>
      <div>
        <h3 class="text-base font-black text-slate-900">Update Selling Price</h3>
        <p class="text-xs text-slate-500 mt-0.5">{{ stock.product.name }} &bull; Available: {{ stock.quantity_available }} units</p>
      </div>
    </div>
    <button type="button" 
            data-modal-close 
            class="p-2 text-slate-400 hover:text-slate-600 rounded-xl transition-all">
      <i class="fas fa-times text-base"></i>
    </button>
  </div>

  <!-- Form -->
  <form id="stock-price-form" 
        action="{% url 'inventory:stock_price_update' stock.id %}" 
        method="POST" 
        data-ajax="true"
        data-refresh-table="#product-table-container"
        class="mt-5 space-y-4">
    {% csrf_token %}

    <div>
      <label class="block text-xs font-bold text-slate-700 mb-1.5">
        Selling Price (USD) <span class="text-red-500">*</span>
      </label>
      <div class="relative">
        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 font-bold">$</span>
        <input type="number" 
               step="0.01" 
               min="0" 
               name="selling_price" 
               value="{{ stock.selling_price }}"
               required 
               class="w-full pl-8 pr-3.5 py-2.5 rounded-xl border border-slate-300 bg-white text-sm font-black text-slate-900 focus:ring-2 focus:ring-blue-500 outline-none transition-all">
      </div>
      <p class="text-[11px] text-slate-400 mt-1">This price will be used as default for new Point of Sale transactions.</p>
    </div>

    <!-- Modal Footer -->
    <div class="pt-4 border-t border-gray-200 flex items-center justify-end space-x-3">
      <button type="button" 
              data-modal-close 
              class="px-4 py-2.5 rounded-xl border border-slate-300 text-xs font-bold text-slate-700 hover:bg-slate-100 transition-all">
        Cancel
      </button>
      <button type="submit" 
              class="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-black shadow-md shadow-emerald-600/30 transition-all flex items-center">
        <i class="fas fa-check mr-1.5"></i> Save Selling Price
      </button>
    </div>

  </form>

</div>
