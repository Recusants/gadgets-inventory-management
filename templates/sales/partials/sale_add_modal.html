<!-- Record Sale Modal Partial -->
<div class="p-6 sm:p-7">
  
  <div class="flex items-center justify-between pb-4 border-b border-gray-100 dark:border-gray-700">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-2xl bg-emerald-100 dark:bg-emerald-900/40 text-emerald-600 dark:text-emerald-400 flex items-center justify-center text-lg shadow-sm">
        <i class="fas fa-cart-plus"></i>
      </div>
      <div>
        <h3 class="text-lg font-black tracking-tight text-gray-900 dark:text-white">Record Sale</h3>
        <p class="text-xs text-gray-500 dark:text-gray-400">Process an in-stock serialized item sale</p>
      </div>
    </div>
    
    <button type="button" data-modal-close class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 p-1.5 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
      <i class="fas fa-times text-base"></i>
    </button>
  </div>

  <form action="{% url 'sales:sale_create' %}" 
        method="POST" 
        data-ajax="true" 
        data-refresh-table="#sale-table-container"
        class="mt-5 space-y-4">
    {% csrf_token %}

    <div class="space-y-4">
      
      <!-- In Stock Product Selection -->
      <div>
        <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1.5">
          Select In-Stock Item <span class="text-red-500">*</span>
        </label>
        <select name="product" 
                id="sale-modal-product-select"
                required 
                class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 text-xs text-gray-700 dark:text-gray-300 focus:ring-2 focus:ring-emerald-500 outline-none transition-all">
          <option value="">-- Choose item by Name / Serial Number --</option>
          {% for prod in products %}
            <option value="{{ prod.id }}" data-price="{{ prod.selling_price }}">
              {{ prod.name }} (SN: {{ prod.serial_number }}) — ${{ prod.selling_price }}
            </option>
          {% endfor %}
        </select>
        {% if not products %}
          <p class="text-[11px] text-amber-600 dark:text-amber-400 mt-1">
            <i class="fas fa-exclamation-circle"></i> No products are currently In Stock. Please add inventory first.
          </p>
        {% endif %}
      </div>

      <!-- Customer Selection -->
      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300">
            Customer <span class="text-red-500">*</span>
          </label>
          <a href="#" 
             data-modal-url="{% url 'sales:customer_add_modal' %}" 
             data-modal-size="max-w-md"
             class="text-[11px] font-semibold text-blue-600 hover:text-blue-700 dark:text-blue-400">
            + Quick Add Customer
          </a>
        </div>
        <select name="customer" 
                required 
                class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 text-xs text-gray-700 dark:text-gray-300 focus:ring-2 focus:ring-emerald-500 outline-none transition-all">
          <option value="">-- Select Customer --</option>
          {% for cust in customers %}
            <option value="{{ cust.id }}">{{ cust.name }} ({{ cust.phone }})</option>
          {% endfor %}
        </select>
      </div>

      <!-- Amount Sold & Payment Method Grid -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        
        <div>
          <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1.5">
            Amount Sold (USD) <span class="text-red-500">*</span>
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400 text-xs font-bold">$</div>
            <input type="number" 
                   step="0.01" 
                   min="0"
                   name="amount_sold" 
                   id="sale-modal-amount-input"
                   required 
                   placeholder="0.00"
                   class="w-full pl-7 pr-3.5 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 text-xs text-gray-900 dark:text-white focus:ring-2 focus:ring-emerald-500 outline-none transition-all">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1.5">
            Payment Method <span class="text-red-500">*</span>
          </label>
          <select name="payment_method" 
                  required 
                  class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 text-xs text-gray-700 dark:text-gray-300 focus:ring-2 focus:ring-emerald-500 outline-none transition-all">
            {% for val, label in payment_methods %}
              <option value="{{ val }}" {% if val == 'Cash' %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>

      </div>

      <!-- Date of Sale -->
      <div>
        <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1.5">
          Date of Sale
        </label>
        <input type="date" 
               name="date_sold" 
               value="{{ today }}"
               class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 text-xs text-gray-700 dark:text-gray-300 focus:ring-2 focus:ring-emerald-500 outline-none transition-all">
      </div>

    </div>

    <!-- Footer Actions -->
    <div class="pt-4 border-t border-gray-100 dark:border-gray-700 flex justify-end space-x-3">
      <button type="button" 
              data-modal-close
              class="px-5 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 text-xs font-semibold text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
        Cancel
      </button>
      <button type="submit" 
              class="px-6 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold shadow-lg shadow-emerald-600/30 transition-all flex items-center">
        <i class="fas fa-check-circle mr-2"></i> Complete Sale
      </button>
    </div>

  </form>

</div>

<script>
  // Auto-populate selling price when product is selected
  $('#sale-modal-product-select').on('change', function () {
    const selectedOption = $(this).find('option:selected');
    const price = selectedOption.attr('data-price');
    if (price) {
      $('#sale-modal-amount-input').val(price);
    }
  });
</script>
