<div class="p-6">
  <!-- Modal Header -->
  <div class="flex items-center justify-between pb-4 border-b border-gray-100 dark:border-gray-700">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl bg-blue-100 dark:bg-blue-900/40 text-blue-600 dark:text-blue-400 flex items-center justify-center text-lg">
        <i class="fas fa-check-circle"></i>
      </div>
      <div>
        <h3 class="text-base font-bold text-gray-900 dark:text-white">Modal Shell Active</h3>
        <p class="text-xs text-gray-500 dark:text-gray-400">Reusable dynamic modal test</p>
      </div>
    </div>
    <button type="button" data-modal-close class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 text-sm p-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700">
      <i class="fas fa-times text-base"></i>
    </button>
  </div>

  <!-- Modal Body -->
  <div class="py-5 text-sm text-gray-600 dark:text-gray-300 space-y-3">
    <p>This modal is rendered dynamically using <strong>jQuery $.ajax</strong> and swapped into the single reusable <code>#app-modal-shell</code>.</p>
    <div class="p-3 bg-blue-50 dark:bg-blue-950/40 rounded-xl border border-blue-100 dark:border-blue-900 text-xs text-blue-700 dark:text-blue-300">
      <i class="fas fa-info-circle mr-1"></i> All Add, Edit, and Detail screens across Products, Customers, Sales, and Settings reuse this exact modal shell.
    </div>
  </div>

  <!-- Modal Footer -->
  <div class="pt-4 border-t border-gray-100 dark:border-gray-700 flex justify-end space-x-3">
    <button type="button" data-modal-close class="px-4 py-2 rounded-xl border border-gray-200 dark:border-gray-700 text-xs font-semibold text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
      Dismiss
    </button>
    <button type="button" onclick="notifySwal('Verified!', 'Modal and SweetAlert2 are working synchronously.', 'success'); ModalManager.close();" class="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold shadow-md transition-colors">
      Test Success Toast
    </button>
  </div>
</div>
