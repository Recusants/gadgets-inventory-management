{% load static %}
<!-- Global Feature Search Command Palette Modal (Apple Minimalist Design) -->
<div id="featureSearchModal" 
     class="fixed inset-0 z-[9999999] hidden items-center justify-center p-4 select-none" 
     style="background-color: rgba(10, 25, 47, 0.45); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);"
     onclick="handleSearchOverlayClick(event)">
  <div class="w-full max-w-2xl bg-white rounded-3xl border border-slate-200 shadow-2xl overflow-hidden flex flex-col max-h-[85vh] animate-pop" 
       onclick="event.stopPropagation()">
    
    <!-- Top Search Input Bar -->
    <div class="h-16 px-5 border-b border-slate-100 flex items-center space-x-3.5 bg-white flex-shrink-0">
      <div class="w-9 h-9 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center flex-shrink-0">
        <i class="fas fa-search text-sm"></i>
      </div>
      <input type="text" 
             id="globalFeatureSearchInput" 
             placeholder="Search features, pages, reports, settings..." 
             autocomplete="off" 
             spellcheck="false"
             class="flex-1 bg-transparent border-none text-sm text-slate-900 placeholder-slate-400 focus:outline-none font-medium">
      <button type="button" 
              onclick="closeFeatureSearchModal()" 
              class="w-8 h-8 rounded-xl text-slate-400 hover:text-slate-700 hover:bg-slate-100 flex items-center justify-center transition-colors focus:outline-none flex-shrink-0"
              title="Close (Esc)">
        <i class="fas fa-times text-xs"></i>
      </button>
    </div>

    <!-- Category Filter Chips -->
    <div id="featureCategoryChips" class="px-5 py-2.5 border-b border-slate-100 bg-slate-50/70 flex items-center space-x-1.5 overflow-x-auto custom-scrollbar flex-shrink-0">
      <button type="button" class="search-cat-chip active" data-cat="ALL" onclick="filterFeaturesByCategory('ALL')">All</button>
      <button type="button" class="search-cat-chip" data-cat="Point of Sale" onclick="filterFeaturesByCategory('Point of Sale')">POS</button>
      <button type="button" class="search-cat-chip" data-cat="Inventory" onclick="filterFeaturesByCategory('Inventory')">Inventory</button>
      <button type="button" class="search-cat-chip" data-cat="Sales" onclick="filterFeaturesByCategory('Sales')">Sales</button>
      <button type="button" class="search-cat-chip" data-cat="Compliance" onclick="filterFeaturesByCategory('Compliance')">ZIMRA</button>
      <button type="button" class="search-cat-chip" data-cat="Reports" onclick="filterFeaturesByCategory('Reports')">Reports</button>
      <button type="button" class="search-cat-chip" data-cat="Accounting" onclick="filterFeaturesByCategory('Accounting')">Accounting</button>
      <button type="button" class="search-cat-chip" data-cat="Hardware" onclick="filterFeaturesByCategory('Hardware')">Printers</button>
      <button type="button" class="search-cat-chip" data-cat="Settings" onclick="filterFeaturesByCategory('Settings')">Settings</button>
    </div>

    <!-- Results Container -->
    <div id="featureSearchResults" class="flex-1 overflow-y-auto p-3 custom-scrollbar divide-y divide-slate-50 min-h-[220px] max-h-[440px]">
      <div class="py-12 text-center text-slate-400 text-xs">
        <i class="fas fa-circle-notch fa-spin text-lg text-blue-600 mb-2"></i>
        <div>Loading system features...</div>
      </div>
    </div>

    <!-- Footer Shortcuts -->
    <div class="px-5 py-3 border-t border-slate-100 bg-slate-50/80 flex items-center justify-between text-xs text-slate-400 flex-shrink-0">
      <div class="flex items-center space-x-3">
        <span class="flex items-center space-x-1">
          <kbd class="px-1.5 py-0.5 rounded bg-white border border-slate-200 text-[10px] font-mono text-slate-500 shadow-xs">↑</kbd>
          <kbd class="px-1.5 py-0.5 rounded bg-white border border-slate-200 text-[10px] font-mono text-slate-500 shadow-xs">↓</kbd>
          <span>Navigate</span>
        </span>
        <span class="flex items-center space-x-1">
          <kbd class="px-1.5 py-0.5 rounded bg-white border border-slate-200 text-[10px] font-mono text-slate-500 shadow-xs">↵</kbd>
          <span>Select</span>
        </span>
        <span class="flex items-center space-x-1">
          <kbd class="px-1.5 py-0.5 rounded bg-white border border-slate-200 text-[10px] font-mono text-slate-500 shadow-xs">esc</kbd>
          <span>Close</span>
        </span>
      </div>
      <span id="featuresTotalCounter" class="text-[11px] font-medium text-slate-500">Ready</span>
    </div>

  </div>
</div>
