{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>Sign In — 21 Void Technologies</title>
  <link rel="icon" type="image/jpeg" href="{% static 'img/logo.jpg' %}">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <style>
    body {
      background: radial-gradient(circle at top, #0f172a 0%, #020617 100%);
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 select-none">

  <div class="w-full max-w-md bg-slate-900/90 backdrop-blur-xl border border-slate-800 p-8 rounded-3xl shadow-2xl shadow-black/60 space-y-6">
    
    <!-- Logo & Title Header -->
    <div class="text-center space-y-2">
      <div class="inline-flex p-3 rounded-2xl bg-black border border-slate-800 shadow-inner">
        <img src="{% static 'img/logo.jpg' %}" alt="21 Void Logo" class="w-14 h-14 object-contain">
      </div>
      <h1 class="text-2xl font-black text-white tracking-tight flex items-center justify-center space-x-1">
        <span class="text-blue-500">21</span><span>VOID</span>
      </h1>
      <p class="text-xs text-slate-400 font-medium">Record Keeping & Sales Management System</p>
    </div>

    <!-- Login Form (Raw HTML, jQuery $.ajax submitted, Zero Django Forms) -->
    <form action="{% url 'accounts:login' %}" 
          method="POST" 
          data-ajax="true"
          class="space-y-4">
      {% csrf_token %}

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">
          Username <span class="text-red-500">*</span>
        </label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
            <i class="fas fa-user text-xs"></i>
          </div>
          <input type="text" 
                 name="username" 
                 required 
                 autofocus
                 placeholder="e.g. admin"
                 class="w-full pl-9 pr-3.5 py-3 rounded-xl border border-slate-700 bg-slate-950 text-xs text-white placeholder-slate-500 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">
          Password <span class="text-red-500">*</span>
        </label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
            <i class="fas fa-lock text-xs"></i>
          </div>
          <input type="password" 
                 name="password" 
                 required 
                 placeholder="••••••••"
                 class="w-full pl-9 pr-3.5 py-3 rounded-xl border border-slate-700 bg-slate-950 text-xs text-white placeholder-slate-500 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
        </div>
      </div>

      <div class="pt-2">
        <button type="submit" 
                class="w-full py-3.5 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold tracking-wide uppercase shadow-lg shadow-blue-600/30 transition-all flex items-center justify-center space-x-2">
          <span>Sign In to System</span>
          <i class="fas fa-arrow-right text-xs"></i>
        </button>
      </div>

    </form>

    <!-- Footer Tagline -->
    <div class="pt-4 border-t border-slate-800/80 text-center">
      <p class="text-[11px] text-slate-500 italic">
        Fusing Technology With Market Intelligence
      </p>
    </div>

  </div>

  <!-- Reusable modal shell & Core JS -->
  <div id="app-modal-shell" class="hidden"></div>
  <script src="{% static 'vendor/jquery.min.js' %}"></script>
  <script src="{% static 'vendor/sweetalert2.all.min.js' %}"></script>
  <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
