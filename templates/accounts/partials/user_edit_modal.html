<div class="p-6">
  <div class="flex items-center justify-between pb-4 border-b border-gray-100 dark:border-gray-700">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-2xl bg-amber-100 dark:bg-amber-900/40 text-amber-600 dark:text-amber-400 flex items-center justify-center text-lg shadow-sm">
        <i class="fas fa-user-cog"></i>
      </div>
      <div>
        <h3 class="text-base font-bold text-gray-900 dark:text-white">Edit User Account</h3>
        <p class="text-xs text-gray-500 dark:text-gray-400">@{{ target_user.username }}</p>
      </div>
    </div>
    <button type="button" data-modal-close class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 p-1.5 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-700">
      <i class="fas fa-times text-base"></i>
    </button>
  </div>

  <form action="{% url 'accounts:user_update' target_user.id %}" 
        method="POST" 
        data-ajax="true" 
        data-refresh-table="#user-table-container"
        class="mt-4 space-y-4">
    {% csrf_token %}

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1.5">
          First Name
        </label>
        <input type="text" 
               name="first_name" 
               value="{{ target_user.first_name }}"
               class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 text-xs text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none transition-all">
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1.5">
          Last Name
        </label>
        <input type="text" 
               name="last_name" 
               value="{{ target_user.last_name }}"
               class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 text-xs text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none transition-all">
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1.5">
          System Role <span class="text-red-500">*</span>
        </label>
        <select name="role" 
                required 
                class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 text-xs text-gray-700 dark:text-gray-300 focus:ring-2 focus:ring-blue-500 outline-none transition-all">
          {% for val, label in roles %}
            <option value="{{ val }}" {% if val == target_user.role %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1.5">
          Contact Phone
        </label>
        <input type="text" 
               name="phone" 
               value="{{ target_user.phone|default:'' }}"
               class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 text-xs text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none transition-all">
      </div>

      <div class="sm:col-span-2">
        <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1.5">
          Email Address
        </label>
        <input type="email" 
               name="email" 
               value="{{ target_user.email|default:'' }}"
               class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 text-xs text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none transition-all">
      </div>

      <div class="sm:col-span-2 p-3.5 bg-gray-50 dark:bg-gray-900 rounded-xl border border-gray-100 dark:border-gray-700">
        <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1.5">
          Reset Password (leave blank to keep current)
        </label>
        <input type="password" 
               name="password" 
               placeholder="Enter new password (optional)"
               class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 text-xs text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none transition-all">
      </div>
    </div>

    <div class="pt-4 border-t border-gray-100 dark:border-gray-700 flex justify-end space-x-3">
      <button type="button" data-modal-close class="px-4 py-2 rounded-xl border border-gray-300 dark:border-gray-600 text-xs font-semibold text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
        Cancel
      </button>
      <button type="submit" class="px-5 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold shadow-md transition-all flex items-center">
        <i class="fas fa-save mr-2"></i> Update Account
      </button>
    </div>
  </form>
</div>
