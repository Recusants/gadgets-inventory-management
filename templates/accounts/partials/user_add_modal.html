<div class="p-6">
  <div class="flex items-center justify-between pb-4 border-b border-slate-100">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center text-lg shadow-sm border border-blue-100">
        <i class="fas fa-user-plus"></i>
      </div>
      <div>
        <h3 class="text-base font-black text-slate-900">Add User Account</h3>
        <p class="text-xs text-slate-400">Register new staff, manager, or administrator login credentials</p>
      </div>
    </div>
    <button type="button" data-modal-close class="text-slate-400 hover:text-slate-600 p-1.5 rounded-xl hover:bg-slate-100 transition-colors">
      <i class="fas fa-times text-base"></i>
    </button>
  </div>

  <form action="{% url 'accounts:user_create' %}" 
        method="POST" 
        data-ajax="true" 
        data-refresh-table="#user-table-container"
        class="mt-4 space-y-4">
    {% csrf_token %}

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1.5">
          Username <span class="text-red-500">*</span>
        </label>
        <input type="text" 
               name="username" 
               required 
               placeholder="e.g. jsmith"
               class="w-full px-3.5 py-2 rounded-xl border border-slate-300 bg-white text-xs font-semibold text-slate-900 focus:ring-2 focus:ring-blue-500 outline-none transition-all">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1.5">
          Initial Password <span class="text-red-500">*</span>
        </label>
        <div class="relative">
          <input type="password" 
                 name="password" 
                 id="modal-add-password"
                 required 
                 placeholder="Min 6 characters"
                 class="w-full pl-3.5 pr-9 py-2 rounded-xl border border-slate-300 bg-white text-xs font-semibold text-slate-900 focus:ring-2 focus:ring-blue-500 outline-none transition-all">
          <button type="button" 
                  tabindex="-1"
                  onclick="const el=document.getElementById('modal-add-password'); const ic=this.querySelector('i'); if(el.type==='password'){el.type='text';ic.className='fas fa-eye-slash text-blue-600';}else{el.type='password';ic.className='fas fa-eye';}"
                  class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-blue-600 focus:outline-none transition-colors"
                  title="Show / Hide Password">
            <i class="fas fa-eye text-xs"></i>
          </button>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1.5">
          First Name
        </label>
        <input type="text" 
               name="first_name" 
               placeholder="John"
               class="w-full px-3.5 py-2 rounded-xl border border-slate-300 bg-white text-xs font-semibold text-slate-900 focus:ring-2 focus:ring-blue-500 outline-none transition-all">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1.5">
          Last Name
        </label>
        <input type="text" 
               name="last_name" 
               placeholder="Smith"
               class="w-full px-3.5 py-2 rounded-xl border border-slate-300 bg-white text-xs font-semibold text-slate-900 focus:ring-2 focus:ring-blue-500 outline-none transition-all">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1.5">
          System Role <span class="text-red-500">*</span>
        </label>
        <select name="role" 
                required 
                class="w-full px-3.5 py-2 rounded-xl border border-slate-300 bg-white text-xs font-semibold text-slate-700 focus:ring-2 focus:ring-blue-500 outline-none transition-all">
          {% for val, label in roles %}
            <option value="{{ val }}" {% if val == 'STAFF' %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1.5">
          Contact Phone
        </label>
        <input type="text" 
               name="phone" 
               placeholder="e.g. 0771234567"
               class="w-full px-3.5 py-2 rounded-xl border border-slate-300 bg-white text-xs font-semibold text-slate-900 focus:ring-2 focus:ring-blue-500 outline-none transition-all">
      </div>

      <div class="sm:col-span-2">
        <label class="block text-xs font-bold text-slate-700 mb-1.5">
          Email Address
        </label>
        <input type="email" 
               name="email" 
               placeholder="user@availtechnologies.com"
               class="w-full px-3.5 py-2 rounded-xl border border-slate-300 bg-white text-xs font-semibold text-slate-900 focus:ring-2 focus:ring-blue-500 outline-none transition-all">
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="pt-4 border-t border-slate-100 flex justify-end space-x-2.5">
      <button type="button" data-modal-close class="btn-default">
        Cancel
      </button>
      <button type="submit" class="btn-primary">
        <i class="fas fa-user-plus mr-2 text-xs"></i> Create Account
      </button>
    </div>
  </form>
</div>
