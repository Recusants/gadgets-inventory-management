{% extends 'base.html' %}
{% load static %}

{% block title %}User Management{% endblock %}

{% block content %}
<div class="space-y-5">
  
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between pb-1">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-2xl bg-blue-100 dark:bg-blue-900/40 text-blue-600 dark:text-blue-400 flex items-center justify-center text-xl shadow-sm">
        <i class="fas fa-user-shield"></i>
      </div>
      <div>
        <h1 class="text-2xl font-black tracking-tight text-slate-900 dark:text-white">User Accounts</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Manage staff, managers, and system administrators</p>
      </div>
    </div>

    <div class="mt-4 sm:mt-0">
      <button type="button" 
              data-modal-url="{% url 'accounts:user_add_modal' %}"
              data-modal-size="max-w-lg"
              class="inline-flex items-center px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-xl shadow-md shadow-blue-600/20 transition-all">
        <i class="fas fa-user-plus mr-2 text-xs"></i> Add User Account
      </button>
    </div>
  </div>

  <!-- Search & Role Filter Toolbar -->
  <div class="app-card bg-white dark:bg-gray-800 p-4 rounded-2xl border border-gray-200 dark:border-gray-700">
    <form id="user-filter-form" class="grid grid-cols-1 sm:grid-cols-3 gap-3">
      <div class="sm:col-span-2 relative">
        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
          <i class="fas fa-search text-xs"></i>
        </div>
        <input type="text" 
               name="q" 
               id="user-search-input"
               placeholder="Search by username, name, or email..." 
               class="w-full pl-9 pr-3.5 py-2 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 text-xs text-gray-900 dark:text-white focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none transition-all">
      </div>

      <div>
        <select name="role" 
                id="user-role-select"
                class="w-full px-3 py-2 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 text-xs text-gray-700 dark:text-gray-300 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none transition-all">
          <option value="">All Roles</option>
          {% for val, label in roles %}
            <option value="{{ val }}">{{ label }}</option>
          {% endfor %}
        </select>
      </div>
    </form>
  </div>

  <!-- Dynamic AJAX Table Container -->
  <div id="user-table-container" 
       data-table-url="{% url 'accounts:user_table' %}"
       data-filter-form="#user-filter-form"
       class="app-card bg-white dark:bg-gray-800 rounded-2xl border border-gray-200 dark:border-gray-700 overflow-hidden shadow-sm">
    {% include 'accounts/partials/user_table.html' %}
  </div>

</div>
{% endblock %}

{% block extra_js %}
<script>
  $(document).ready(function () {
    refreshTable('#user-table-container');

    $('#user-role-select').on('change', function () {
      refreshTable('#user-table-container');
    });

    let searchTimer;
    $('#user-search-input').on('keyup', function () {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        refreshTable('#user-table-container');
      }, 300);
    });

    $(document).on('click', '#user-table-container .pagination-link', function (e) {
      e.preventDefault();
      const page = $(this).attr('data-page');
      if (page) {
        refreshTable('#user-table-container', { page: page });
      }
    });
  });
</script>
{% endblock %}
