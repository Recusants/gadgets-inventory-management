<div class="p-6">
  <div class="flex items-center justify-between pb-4 border-b border-slate-100">
    <div class="flex items-center space-x-3">
      <div class="w-9 h-9 rounded-xl bg-blue-600 text-white flex items-center justify-center">
        <i class="fas fa-tags"></i>
      </div>
      <div>
        <h3 class="text-base font-black text-slate-900">Add Expense Category</h3>
        <p class="text-xs text-slate-400">Create a classification for business expenses</p>
      </div>
    </div>
    <button type="button" onclick="closeModal()" class="text-slate-400 hover:text-slate-600 transition-colors">
      <i class="fas fa-times text-base"></i>
    </button>
  </div>

  <form id="category-add-form" action="{% url 'expenses:category_create' %}" method="POST" class="mt-5 space-y-4">
    {% csrf_token %}

    <div>
      <label class="block text-xs font-bold text-slate-700 mb-1">Category Name *</label>
      <input type="text" name="name" required placeholder="e.g. Rent, Utilities, Salaries, Logistics"
             class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-xs font-semibold focus:ring-2 focus:ring-blue-500 outline-none">
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Default Amount ($)</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center font-bold text-slate-400 text-xs">$</span>
          <input type="number" step="0.01" min="0" name="default_amount" value="0.00"
                 class="w-full pl-7 pr-3 py-2 rounded-xl border border-slate-300 text-xs font-mono font-bold focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <p class="text-[10px] text-slate-400 mt-1">Pre-fills amount when logging this expense</p>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Recurring Interval</label>
        <select name="recurring_interval" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs font-semibold focus:ring-2 focus:ring-blue-500 outline-none">
          <option value="DAILY">Daily</option>
          <option value="WEEKLY">Weekly</option>
          <option value="MONTHLY" selected>Monthly</option>
          <option value="YEARLY">Yearly</option>
        </select>
        <label class="inline-flex items-center mt-2 cursor-pointer">
          <input type="checkbox" name="is_recurring" value="1" class="rounded text-blue-600 focus:ring-blue-500 w-4 h-4 mr-2">
          <span class="text-xs font-bold text-slate-700">Auto-recurring Expense</span>
        </label>
      </div>
    </div>

    <div>
      <label class="block text-xs font-bold text-slate-700 mb-1">Description (Optional)</label>
      <textarea name="description" rows="2" placeholder="Brief note on what expenses fall under this category..."
                class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs font-medium focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
    </div>

    <div class="pt-3 border-t border-slate-100 flex items-center justify-end space-x-2">
      <button type="button" onclick="closeModal()" class="btn-secondary">
        Cancel
      </button>
      <button type="submit" class="btn-primary">
        <i class="fas fa-save mr-1.5"></i> Save Category
      </button>
    </div>
  </form>
</div>

<script>
  $('#category-add-form').on('submit', function (e) {
    e.preventDefault();
    const $form = $(this);
    const $submit = $form.find('button[type="submit"]');
    $submit.prop('disabled', true).html('<i class="fas fa-spinner fa-spin mr-1"></i> Saving...');

    $.ajax({
      url: $form.attr('action'),
      type: 'POST',
      data: $form.serialize(),
      success: function (res) {
        if (res.status === 'success') {
          closeModal();
          showNotification(res.message, 'success');
          refreshTable('#category-table-container');
        } else {
          $submit.prop('disabled', false).html('<i class="fas fa-save mr-1.5"></i> Save Category');
          showNotification(res.message || 'Error occurred', 'error');
        }
      },
      error: function (xhr) {
        $submit.prop('disabled', false).html('<i class="fas fa-save mr-1.5"></i> Save Category');
        showNotification(xhr.responseJSON?.message || 'Server error occurred', 'error');
      }
    });
  });
</script>
