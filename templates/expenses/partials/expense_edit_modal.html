<div class="p-6">
  <div class="flex items-center justify-between pb-4 border-b border-slate-100">
    <div class="flex items-center space-x-3">
      <div class="w-9 h-9 rounded-xl bg-blue-700 text-white flex items-center justify-center">
        <i class="fas fa-pen"></i>
      </div>
      <div>
        <h3 class="text-base font-black text-slate-900">Edit Business Expense</h3>
        <p class="text-xs text-slate-400">Update details for #EXP-{{ expense.id }}</p>
      </div>
    </div>
    <button type="button" onclick="closeModal()" class="text-slate-400 hover:text-slate-600 transition-colors">
      <i class="fas fa-times text-base"></i>
    </button>
  </div>

  <form id="expense-edit-form" action="{% url 'expenses:expense_update' expense.pk %}" method="POST" class="mt-5 space-y-4">
    {% csrf_token %}

    <div>
      <label class="block text-xs font-bold text-slate-700 mb-1">Expense Description / Title *</label>
      <input type="text" name="title" value="{{ expense.title }}" required
             class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-xs font-semibold focus:ring-2 focus:ring-blue-500 outline-none">
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <div class="relative custom-searchable-combobox" id="edit-expense-cat-combobox">
        <label class="block text-xs font-bold text-slate-700 mb-1">Expense Category *</label>
        <input type="text" 
               class="combobox-input w-full px-3.5 py-2 rounded-xl border border-slate-300 text-xs font-semibold focus:ring-2 focus:ring-blue-500 outline-none" 
               placeholder="Type to search or use arrows..." 
               value="{{ expense.category.name }}"
               autocomplete="off">
        <input type="hidden" name="category" class="combobox-hidden" value="{{ expense.category_id }}" required>
        
        <div class="combobox-dropdown hidden absolute z-30 w-full mt-1 bg-white border border-slate-200 rounded-xl shadow-xl max-h-48 overflow-y-auto divide-y divide-slate-100">
          {% for cat in categories %}
            <div class="p-2.5 hover:bg-blue-50 cursor-pointer combobox-option text-xs flex justify-between items-center transition-colors {% if cat.id == expense.category_id %}bg-blue-50/70 font-bold{% endif %}"
                 data-id="{{ cat.id }}" 
                 data-name="{{ cat.name }}">
              <span class="font-semibold text-slate-800">{{ cat.name }}</span>
            </div>
          {% endfor %}
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Amount ($) *</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center font-bold text-slate-400 text-xs">$</span>
          <input type="number" step="0.01" min="0.01" name="amount" value="{{ expense.amount }}" required
                 class="w-full pl-7 pr-3 py-2 rounded-xl border border-slate-300 text-xs font-mono font-bold focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <label class="block text-xs font-bold text-slate-700 mt-2 mb-1">Expense Date *</label>
        <input type="date" name="date" value="{{ expense.date|date:'Y-m-d' }}" required
               class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs font-semibold focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Payment Method</label>
        <select name="payment_method" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs font-semibold focus:ring-2 focus:ring-blue-500 outline-none">
          <option value="Cash" {% if expense.payment_method == 'Cash' %}selected{% endif %}>Cash</option>
          <option value="Bank Transfer" {% if expense.payment_method == 'Bank Transfer' %}selected{% endif %}>Bank Transfer</option>
          <option value="Card" {% if expense.payment_method == 'Card' %}selected{% endif %}>Credit/Debit Card</option>
          <option value="EcoCash" {% if expense.payment_method == 'EcoCash' %}selected{% endif %}>EcoCash / Mobile Money</option>
          <option value="Other" {% if expense.payment_method == 'Other' %}selected{% endif %}>Other</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Reference / Invoice #</label>
        <input type="text" name="reference_number" value="{{ expense.reference_number|default:'' }}"
               class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs font-semibold focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
    </div>

    <div>
      <label class="block text-xs font-bold text-slate-700 mb-1">Notes / Remarks</label>
      <textarea name="notes" rows="2"
                class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs font-medium focus:ring-2 focus:ring-blue-500 outline-none">{{ expense.notes|default:'' }}</textarea>
    </div>

    <div class="pt-3 border-t border-slate-100 flex items-center justify-end space-x-2">
      <button type="button" onclick="closeModal()" class="btn-secondary">
        Cancel
      </button>
      <button type="submit" class="btn-primary">
        <i class="fas fa-save mr-1.5"></i> Update Expense
      </button>
    </div>
  </form>
</div>

<script>
  if (window.initSearchableCombobox) {
    window.initSearchableCombobox('#edit-expense-cat-combobox');
  }

  $('#expense-edit-form').on('submit', function (e) {
    e.preventDefault();
    const $form = $(this);
    const $submit = $form.find('button[type="submit"]');
    $submit.prop('disabled', true).html('<i class="fas fa-spinner fa-spin mr-1"></i> Saving...');

    $.ajax({
      url: $form.attr('action'),
      type: 'POST',
      data: $form.serialize(),
      success: function (res) {
        if (res.status === 'success') {
          closeModal();
          showNotification(res.message, 'success');
          refreshTable('#expense-table-container');
        } else {
          $submit.prop('disabled', false).html('<i class="fas fa-save mr-1.5"></i> Update Expense');
          showNotification(res.message || 'Error occurred', 'error');
        }
      },
      error: function (xhr) {
        $submit.prop('disabled', false).html('<i class="fas fa-save mr-1.5"></i> Update Expense');
        showNotification(xhr.responseJSON?.message || 'Server error occurred', 'error');
      }
    });
  });
</script>
