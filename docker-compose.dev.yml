# docker-compose.dev.yml — Gadget Store System
# Dev Environment: Live Reload with PostgreSQL (matching Clarity Retail LAN)
# Web Port: 8001 | DB Port: 5433

services:

  db:
    image: postgres:16-alpine
    container_name: dev-gadget-store-postgres
    environment:
      POSTGRES_DB: ${DEV_DB_NAME:-${DB_NAME:-gadget_store_dev_db}}
      POSTGRES_USER: ${DEV_DB_USER:-${DB_USER:-gadget_dev_user}}
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:-${DB_PASSWORD:-dev_password}}
    ports:
      - "${DEV_DB_PORT:-5433}:5432"
    volumes:
      - dev_gadget_store_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DEV_DB_USER:-${DB_USER:-gadget_dev_user}} -d ${DEV_DB_NAME:-${DB_NAME:-gadget_store_dev_db}}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dev-gadget-store-app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${DEV_HTTP_PORT:-8001}:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.docker_dev
      DEBUG: "True"
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-gadget-store-docker-12345}
      DB_NAME: ${DEV_DB_NAME:-${DB_NAME:-gadget_store_dev_db}}
      DB_USER: ${DEV_DB_USER:-${DB_USER:-gadget_dev_user}}
      DB_PASSWORD: ${DEV_DB_PASSWORD:-${DB_PASSWORD:-dev_password}}
      DB_HOST: db
      DB_PORT: "5432"
      POSTGRES_DB: ${DEV_DB_NAME:-${DB_NAME:-gadget_store_dev_db}}
      POSTGRES_USER: ${DEV_DB_USER:-${DB_USER:-gadget_dev_user}}
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:-${DB_PASSWORD:-dev_password}}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    volumes:
      - .:/app
      - /app/__pycache__
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000

volumes:
  dev_gadget_store_postgres_data:
