# docker-compose.prod.yml — Gadget Store System
# Usage: docker compose -f docker-compose.prod.yml up -d

services:

  db:
    image: postgres:16-alpine
    container_name: gadget-store-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-twentyone_void_prod_db}
      POSTGRES_USER: ${POSTGRES_USER:-twentyone_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeThisSecureProdPassword2026!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-twentyone_user} -d ${POSTGRES_DB:-twentyone_void_prod_db}"]
      interval: 2s
      timeout: 3s
      retries: 5
      start_period: 3s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  web:
    image: ${DOCKER_REGISTRY:-tinashemp}/gadget-store-app:${TAG:-latest}
    container_name: gadget-store-app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${HTTP_PORT:-8086}:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.docker_prod
      DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-ChangeThisProdSecretKey2026!}
      SECRET_KEY: ${DJANGO_SECRET_KEY:-ChangeThisProdSecretKey2026!}
      POSTGRES_DB: ${POSTGRES_DB:-twentyone_void_prod_db}
      POSTGRES_USER: ${POSTGRES_USER:-twentyone_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeThisSecureProdPassword2026!}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://127.0.0.1:8086,http://localhost:8086}
      SENTRY_DSN: ${SENTRY_DSN:-${SENTRY_KEY:-}}
      SENTRY_KEY: ${SENTRY_KEY:-${SENTRY_DSN:-}}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-0}
    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/accounts/login/')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.5"
        reservations:
          memory: 384M

volumes:
  postgres_data:
